org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Chaquopy 构建机 Python：app/build.gradle 会自动探测；若探测不到，
# 取消下一行注释并改成你机器上 python.exe 的绝对路径（Windows 用正斜杠）：
chaquopy.buildPython=C\:/Users/Administrator/AppData/Roaming/uv/python/cpython-3.11.16-windows-x86_64-none/python.exe

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
